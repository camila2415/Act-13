<!DOCTYPE html>
<html lang="es">
<link rel="stylesheet" href="css/styles.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGG - Registro</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Botón de Tema (sin emoji) -->
    <div class="header-tools">
        <button id="btnTema" class="btn-theme">Modo Día / Noche</button>
    </div>

    <!-- Título Principal -->
    <h1 class="titulo-principal">Sistema de Gestión de Gastos</h1>

    <!-- Tarjeta del Formulario -->
    <main class="login-card">
        <h2>Crear cuenta</h2>

        <form id="formRegistro">
            <div class="form-group">
                <label for="nombre">Nombre/s</label>
                <input type="text" id="nombre" required>
            </div>

            <div class="form-group">
                <label for="apellido">Apellido/s</label>
                <input type="text" id="apellido" required>
            </div>

            <div class="form-group">
                <label for="fecha">Fecha de nacimiento</label>
                <input type="date" id="fecha" required>
            </div>

            <div class="form-group">
                <label for="emailRegistro">Correo electrónico</label>
                <input type="email" id="emailRegistro" required>
            </div>

            <div class="form-group">
                <label for="passwordRegistro">Contraseña</label>
                <input type="password" id="passwordRegistro" required>
                <button type="button" id="verPasswordRegistro" class="btn-eye">👁 Mostrar contraseña</button>
            </div>

            <!-- Requisitos para la contraseña -->
            <ul id="requisitos" class="lista-requisitos">
                <li id="longitud">❌ Mínimo 8 caracteres</li>
                <li id="mayuscula">❌ Una letra mayúscula</li>
                <li id="minuscula">❌ Una letra minúscula</li>
                <li id="numero">❌ Un número</li>
                <li id="especial">❌ Un símbolo especial</li>
            </ul>

            <div class="form-group">
                <label for="repetirPassword">Repetir contraseña</label>
                <input type="password" id="repetirPassword" required>
            </div>

            <button type="submit" id="btnRegistrar" class="btn-ingresar" disabled>
                Registrarse
            </button>
        </form>

        <div class="links-container">
            <a href="index.html" class="link">Volver al inicio</a>
        </div>
    </main>

    <script src="js/koo.js"></script>
</body>
</html>
