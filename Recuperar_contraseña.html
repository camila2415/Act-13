<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGG - Recuperar contraseña</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Botón de Tema (sin emoji) -->
    <div class="header-tools">
        <button id="btnTema" class="btn-theme">Modo Día / Noche</button>
    </div>

    <!-- Título Principal -->
    <h1 class="titulo-principal">Sistema de Gestión de Gastos</h1>

    <!-- Tarjeta del Formulario -->
    <main class="login-card">
        <h2>Cambiar contraseña</h2>

        <form id="formRecuperar">
            <div class="form-group">
                <label for="emailRecuperar">Correo electrónico</label>
                <input type="email" id="emailRecuperar" required>
            </div>

            <div class="form-group">
                <label for="nuevaPassword">Nueva contraseña</label>
                <input type="password" id="nuevaPassword" required>
                <button type="button" id="verNuevaPassword" class="btn-eye">👁 Mostrar contraseña</button>
            </div>

            <!-- Requisitos para la contraseña -->
            <ul id="requisitos" class="lista-requisitos">
                <li id="longitud">❌ Mínimo 8 caracteres</li>
                <li id="mayuscula">❌ Una letra mayúscula</li>
                <li id="minuscula">❌ Una letra minúscula</li>
                <li id="numero">❌ Un número</li>
                <li id="especial">❌ Un símbolo especial</li>
            </ul>

            <div class="form-group">
                <label for="repetirNuevaPassword">Repetir contraseña</label>
                <input type="password" id="repetirNuevaPassword" required>
            </div>

            <button type="submit" id="btnCambiar" class="btn-ingresar" disabled>
                Cambiar contraseña
            </button>
        </form>

        <div class="links-container">
            <a href="index.html" class="link">Volver al inicio</a>
        </div>
    </main>

    <script src="js/koo.js"></script>
</body>
</html>
